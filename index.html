<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CubeRush 2048</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --board-bg: rgba(24, 20, 42, 0.78);
            --board-shadow: rgba(10, 8, 22, 0.85);
            --text-color: #ffffff;
        }
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            margin: 0;
            padding: 16px;
            background: #1a1033;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            touch-action: none;
            position: relative;
        }

        /* Живой 3D параллакс-фон на всю страницу */
        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .game-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 375px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }
        .score-box {
            background: var(--board-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 7px 12px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 5px 0 var(--board-shadow), 0 8px 16px rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.16);
            flex: 1;
        }
        .score-label { font-size: 10px; letter-spacing: 1px; opacity: 0.75; font-weight: 800; }
        .score-val { 
            font-size: 20px; 
            font-weight: 900; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            width: 100%;
        }
        button {
            flex: 1;
            padding: 11px 8px;
            border: none;
            border-radius: 12px;
            background: rgba(44, 38, 72, 0.85);
            backdrop-filter: blur(6px);
            color: white;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 0 #141026, 0 8px 12px rgba(0,0,0,0.35);
            border-top: 1px solid rgba(255,255,255,0.22);
            transition: transform 0.1s, box-shadow 0.1s, background 0.2s;
        }
        button.active { 
            background: linear-gradient(180deg, #ff7eb3 0%, #ff3d81 100%);
            box-shadow: 0 5px 0 #9e1447, 0 8px 16px rgba(255, 61, 129, 0.45);
        }
        button:active { 
            transform: translateY(4px); 
            box-shadow: 0 1px 0 #141026;
        }
        .hint {
            font-size: 12.5px;
            font-weight: 600;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            margin-bottom: 12px;
            text-align: center;
        }

        /* 3D Игровое поле со стеклянным эффектом */
        #board {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--board-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 22px;
            padding: 12px;
            display: grid;
            gap: 12px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 
                0 10px 0 var(--board-shadow),
                0 22px 35px rgba(0, 0, 0, 0.65),
                inset 0 2px 4px rgba(255, 255, 255, 0.15);
        }

        .slot {
            background: rgba(14, 12, 28, 0.65);
            border-radius: 14px;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.65), 0 1px 0 rgba(255,255,255,0.08);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: #ffffff;
            cursor: grab;
            position: relative;
            text-shadow: 0 2px 0 rgba(0,0,0,0.35), 0 4px 8px rgba(0,0,0,0.3);
            border-top: 2px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
            touch-action: none;
        }

        .tile:active { cursor: grabbing; }

        .tile.selected {
            transform: translateY(-4px) scale(1.05);
            outline: 3px solid #ffffff;
            filter: brightness(1.15);
            z-index: 5;
        }

        .slot.drag-over .tile {
            transform: scale(1.08);
            outline: 3px dashed #ffffff;
            filter: brightness(1.25);
        }

        .dragging-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: scale(1.12) rotate(3deg);
            opacity: 0.95;
            box-shadow: 0 18px 28px rgba(0,0,0,0.55) !important;
            transition: none !important;
        }

        @keyframes pop {
            0% { transform: scale(0.45); }
            70% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }
        .tile.pop {
            animation: pop 0.24s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Всплывающие очки при слиянии */
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
            100% { opacity: 0; transform: translate(-50%, -48px) scale(1.25); }
        }
        .floating-score {
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            font-weight: 900;
            font-size: 22px;
            color: #ffe066;
            text-shadow: 0 2px 6px rgba(0,0,0,0.85), 0 0 12px rgba(255, 190, 11, 0.8);
            animation: floatUp 0.75s ease-out forwards;
        }

        /* Уникальные 3D-цвета для каждого числа */
        .v-2 {
            background: linear-gradient(180deg, #5cc8ff 0%, #249be8 100%);
            box-shadow: 0 6px 0 #1468a3, 0 10px 15px rgba(0,0,0,0.35);
            font-size: 34px;
        }
        .v-4 {
            background: linear-gradient(180deg, #ffa73b 0%, #f06e00 100%);
            box-shadow: 0 6px 0 #a34700, 0 10px 15px rgba(0,0,0,0.35);
            font-size: 34px;
        }
        .v-8 {
            background: linear-gradient(180deg, #c92a3e 0%, #8a0e1d 100%);
            box-shadow: 0 6px 0 #4f040d, 0 10px 15px rgba(0,0,0,0.4);
            font-size: 34px;
        }
        .v-16 {
            background: linear-gradient(180deg, #a855f7 0%, #731dd8 100%);
            box-shadow: 0 6px 0 #460b8c, 0 10px 15px rgba(0,0,0,0.4);
            font-size: 31px;
        }
        .v-32 {
            background: linear-gradient(180deg, #2ce67a 0%, #0fa34e 100%);
            box-shadow: 0 6px 0 #07612d, 0 10px 15px rgba(0,0,0,0.4);
            font-size: 31px;
        }
        .v-64 {
            background: linear-gradient(180deg, #ff4da6 0%, #d41373 100%);
            box-shadow: 0 6px 0 #820644, 0 10px 15px rgba(0,0,0,0.4);
            font-size: 31px;
        }
        .v-128 {
            background: linear-gradient(180deg, #22e3d6 0%, #099c92 100%);
            box-shadow: 0 6px 0 #045953, 0 10px 15px rgba(0,0,0,0.4);
            font-size: 27px;
        }
        .v-256 {
            background: linear-gradient(180deg, #ffe033 0%, #e0a800 100%);
            box-shadow: 0 6px 0 #8f6900, 0 10px 15px rgba(0,0,0,0.4);
            font-size: 27px;
        }
        .v-512 {
            background: linear-gradient(180deg, #5c7cfa 0%, #364fc7 100%);
            box-shadow: 0 6px 0 #1c2b75, 0 10px
